site_name: Web3 学习笔记
site_url: https://fortresseassiegee.github.io/web3Note/
repo_url: https://github.com/FortresseAssiegee/web3Note
repo_name: FortresseAssiegee/web3Note
docs_dir: .site-docs
site_dir: .site-output
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
