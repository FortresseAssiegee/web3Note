name: 新笔记建议
description: 建议补充主题或示例
title: "[建议] "
body:
  - type: input
    id: topic
    attributes:
      label: 建议主题
      placeholder: 例如账户抽象、钱包备份或 Go 性能分析
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: 所属目录
      options:
        - 区块链学习笔记
        - Go学习笔记
        - 智能合约学习笔记
        - 钱包学习笔记
        - 尚未确定
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 希望解决的问题
      description: 请说明读者看完后应能理解或完成什么
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 可参考的资料
      description: 可选填官方文档、规范或论文链接
    validations:
      required: false
